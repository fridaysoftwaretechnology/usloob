<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>USLOOB — Secure Login</title>

    <style>
        :root {
            --black: #050505;
            --black-soft: #0d0d0d;
            --black-card: #111111;

            --white: #ffffff;
            --white-soft: #f5f5f5;

            --gray-100: #eeeeee;
            --gray-200: #d8d8d8;
            --gray-400: #999999;
            --gray-600: #666666;

            --danger: #dc3545;

            --radius: 16px;
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family:
                "Segoe UI",
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                Arial,
                sans-serif;
        }


        body {
            min-height: 100vh;
            background: var(--black);
            color: var(--white);
            overflow-x: hidden;
        }


        /* =====================================================
       BACKGROUND
    ===================================================== */

        .login-page {
            position: relative;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 20px;

            overflow: hidden;

            background:
                radial-gradient(circle at 15% 20%,
                    rgba(255, 255, 255, 0.08),
                    transparent 30%),
                radial-gradient(circle at 85% 80%,
                    rgba(255, 255, 255, 0.06),
                    transparent 30%),
                #050505;
        }


        .background-grid {
            position: absolute;
            inset: 0;

            opacity: 0.15;

            background-image:
                linear-gradient(rgba(255, 255, 255, 0.04) 1px,
                    transparent 1px),
                linear-gradient(90deg,
                    rgba(255, 255, 255, 0.04) 1px,
                    transparent 1px);

            background-size: 45px 45px;

            mask-image:
                linear-gradient(to bottom,
                    black,
                    transparent);
        }


        .background-glow {
            position: absolute;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.025);

            filter: blur(80px);

            pointer-events: none;
        }


        .background-glow.one {
            top: -250px;
            left: -200px;
        }


        .background-glow.two {
            right: -250px;
            bottom: -250px;
        }


        /* =====================================================
       LOGIN CARD
    ===================================================== */

        .login-container {
            position: relative;
            z-index: 5;

            width: 100%;
            max-width: 430px;
        }


        .login-card {
            position: relative;

            padding: 42px 40px 35px;

            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, 0.075),
                    rgba(255, 255, 255, 0.025));

            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: var(--radius);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            animation: cardAppear 0.55s ease;
        }


        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =====================================================
       LOGO
    ===================================================== */

        .logo-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;

            margin-bottom: 28px;
        }


        .logo {
            display: block;

            width: 105px;
            height: 105px;

            object-fit: contain;

            border-radius: 14px;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.4);

            background: #000;

            animation: logoAppear 0.7s ease;
        }


        @keyframes logoAppear {

            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }


        /* =====================================================
       HEADER
    ===================================================== */

        .header {
            text-align: center;
            margin-bottom: 32px;
        }


        .header h1 {
            color: var(--white);

            font-size: 28px;
            font-weight: 700;

            letter-spacing: -0.7px;

            margin-bottom: 8px;
        }


        .header p {
            color: var(--gray-400);

            font-size: 13px;

            line-height: 1.5;
        }


        /* =====================================================
       FORM
    ===================================================== */

        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: var(--gray-200);

            font-size: 13px;
            font-weight: 600;

            letter-spacing: 0.2px;
        }


        .input-wrapper {
            position: relative;
        }


        .input-wrapper input {
            width: 100%;
            height: 52px;

            padding: 0 48px 0 16px;

            color: var(--white);

            background: rgba(255, 255, 255, 0.045);

            border: 1px solid rgba(255, 255, 255, 0.13);

            border-radius: 10px;

            outline: none;

            font-size: 14px;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }


        .input-wrapper input::placeholder {
            color: #666;
        }


        .input-wrapper input:hover {
            border-color: rgba(255, 255, 255, 0.22);
        }


        .input-wrapper input:focus {
            background: rgba(255, 255, 255, 0.07);

            border-color: rgba(255, 255, 255, 0.45);

            box-shadow:
                0 0 0 3px rgba(255, 255, 255, 0.05);
        }


        .input-icon {
            position: absolute;

            right: 16px;
            top: 50%;

            transform: translateY(-50%);

            color: #777;

            font-size: 14px;

            pointer-events: none;
        }


        /* =====================================================
       PASSWORD TOGGLE
    ===================================================== */

        .password-toggle {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            border: none;
            background: transparent;

            color: #888;

            font-size: 12px;
            font-weight: 600;

            cursor: pointer;

            padding: 7px;
        }


        .password-toggle:hover {
            color: white;
        }


        /* =====================================================
       ERROR
    ===================================================== */

        .error-message {
            display: none;

            margin: -3px 0 16px;

            padding: 11px 13px;

            color: #ff8b96;

            background: rgba(220, 53, 69, 0.08);

            border: 1px solid rgba(220, 53, 69, 0.22);

            border-radius: 8px;

            font-size: 12px;

            line-height: 1.4;

            text-align: center;
        }


        .error-message.show {
            display: block;

            animation: errorAppear 0.2s ease;
        }


        @keyframes errorAppear {

            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =====================================================
       LOGIN BUTTON
    ===================================================== */

        .login-button {
            width: 100%;
            height: 52px;

            margin-top: 4px;

            border: none;
            border-radius: 10px;

            background: var(--white);
            color: var(--black);

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.25);
        }


        .login-button:hover {
            background: #e9e9e9;

            transform: translateY(-1px);

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.35);
        }


        .login-button:active {
            transform: translateY(0);
        }


        .login-button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
            transform: none;
        }


        .button-content {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 10px;
        }


        .spinner {
            width: 17px;
            height: 17px;

            border: 2px solid rgba(0, 0, 0, 0.18);
            border-top-color: #000;

            border-radius: 50%;

            animation: spin 0.7s linear infinite;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }
        }


        /* =====================================================
       FOOTER
    ===================================================== */

        .footer {
            margin-top: 28px;
            padding-top: 20px;

            border-top: 1px solid rgba(255, 255, 255, 0.08);

            text-align: center;
        }


        .footer p {
            color: #666;

            font-size: 11px;

            line-height: 1.6;
        }


        .footer strong {
            color: #aaa;
            font-weight: 600;
        }


        /* =====================================================
       SUCCESS LOADER
    ===================================================== */

        .success-screen {
            position: fixed;
            inset: 0;

            z-index: 9999;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #050505;

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.3s ease,
                visibility 0.3s ease;
        }


        .success-screen.show {
            opacity: 1;
            visibility: visible;
        }


        .success-content {
            text-align: center;
        }


        .success-logo {
            width: 85px;
            height: 85px;

            object-fit: contain;

            border-radius: 12px;

            margin-bottom: 25px;

            animation: successLogo 0.5s ease;
        }


        @keyframes successLogo {

            from {
                opacity: 0;
                transform: scale(0.85);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }


        .success-content h2 {
            font-size: 23px;

            margin-bottom: 8px;
        }


        .success-content p {
            color: #888;

            font-size: 13px;
        }


        .success-spinner {
            width: 32px;
            height: 32px;

            margin: 22px auto;

            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: white;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }


        /* =====================================================
       RESPONSIVE
    ===================================================== */

        @media (max-width: 500px) {

            .login-page {
                padding: 18px;
            }


            .login-card {
                padding: 35px 24px 28px;
            }


            .logo {
                width: 90px;
                height: 90px;
            }


            .header h1 {
                font-size: 24px;
            }
        }


        @media (max-height: 700px) {

            .login-card {
                padding-top: 28px;
                padding-bottom: 25px;
            }


            .logo-wrapper {
                margin-bottom: 18px;
            }


            .logo {
                width: 75px;
                height: 75px;
            }


            .header {
                margin-bottom: 22px;
            }


            .form-group {
                margin-bottom: 14px;
            }


            .footer {
                margin-top: 20px;
                padding-top: 15px;
            }
        }
    </style>


</head>

<body>


    <!-- =====================================================
     LOGIN PAGE
====================================================== -->

    <main class="login-page">

        <div class="background-grid"></div>

        <div class="background-glow one"></div>
        <div class="background-glow two"></div>


        <div class="login-container">

            <section class="login-card">


                <!-- USLOOB LOGO -->

                <div class="logo-wrapper">

                    <img src="logo.png" alt="USLOOB" class="logo">

                </div>


                <!-- HEADER -->

                <header class="header">

                    <h1>
                        Welcome to USLOOB
                    </h1>

                    <p>
                        Sign in to access the USLOOB management system.
                    </p>

                </header>


                <!-- LOGIN FORM -->

                <form id="login-form">


                    <!-- USERNAME -->

                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <div class="input-wrapper">

                            <input type="text" id="username" name="username" placeholder="Enter your username"
                                autocomplete="username" required autofocus>

                            <span class="input-icon">
                                ●
                            </span>

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-wrapper">

                            <input type="password" id="password" name="password" placeholder="Enter your password"
                                autocomplete="current-password" required>

                            <button type="button" class="password-toggle" id="password-toggle">
                                Show
                            </button>

                        </div>

                    </div>


                    <!-- ERROR -->

                    <div class="error-message" id="error-message" role="alert"></div>


                    <!-- LOGIN -->

                    <button type="submit" class="login-button" id="login-button">

                        <span class="button-content" id="button-content">
                            <span>Sign In</span>
                        </span>

                    </button>


                </form>


                <!-- FOOTER -->

                <footer class="footer">

                    <p>
                        © 2026
                        <strong>USLOOB</strong>
                        · Secure Management System
                    </p>

                </footer>


            </section>

        </div>

    </main>


    <!-- =====================================================
     SUCCESS SCREEN
====================================================== -->

    <div class="success-screen" id="success-screen">

        <div class="success-content">

            <img src="logo.png" alt="USLOOB" class="success-logo">

            <h2>
                Login Successful
            </h2>

            <div class="success-spinner"></div>

            <p>
                Preparing your USLOOB dashboard...
            </p>

        </div>

    </div>


    <script>

        /*
         * =====================================================
         * USLOOB LOGIN CONFIGURATION
         * =====================================================
         *
         * Change this URL if your Flask server uses another
         * domain or port.
         */

        const API_URL =
            "https://fridaysoftwaretechnology.pythonanywhere.com";


        /*
         * =====================================================
         * ELEMENTS
         * =====================================================
         */

        const loginForm =
            document.getElementById("login-form");

        const usernameInput =
            document.getElementById("username");

        const passwordInput =
            document.getElementById("password");

        const loginButton =
            document.getElementById("login-button");

        const buttonContent =
            document.getElementById("button-content");

        const errorMessage =
            document.getElementById("error-message");

        const passwordToggle =
            document.getElementById("password-toggle");

        const successScreen =
            document.getElementById("success-screen");


        /*
         * =====================================================
         * PASSWORD VISIBILITY
         * =====================================================
         */

        passwordToggle.addEventListener(
            "click",
            function () {

                if (passwordInput.type === "password") {

                    passwordInput.type = "text";

                    passwordToggle.textContent = "Hide";

                } else {

                    passwordInput.type = "password";

                    passwordToggle.textContent = "Show";

                }

            }
        );


        /*
         * =====================================================
         * ERROR HANDLING
         * =====================================================
         */

        function showError(message) {

            errorMessage.textContent = message;

            errorMessage.classList.add("show");

        }


        function clearError() {

            errorMessage.textContent = "";

            errorMessage.classList.remove("show");

        }


        usernameInput.addEventListener(
            "input",
            clearError
        );


        passwordInput.addEventListener(
            "input",
            clearError
        );


        /*
         * =====================================================
         * LOADING STATE
         * =====================================================
         */

        function setLoading(loading) {

            loginButton.disabled = loading;

            if (loading) {

                buttonContent.innerHTML = `
                <span class="spinner"></span>
                <span>Authenticating...</span>
            `;

            } else {

                buttonContent.innerHTML = `
                <span>Sign In</span>
            `;

            }

        }


        /*
         * =====================================================
         * LOGIN
         * =====================================================
         */

        loginForm.addEventListener("submit", async function (event) {


            event.preventDefault();

            clearError();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showError("Please enter your username and password.");
                return;
            }

            setLoading(true);

            try {

                const response = await fetch(
                    `${API_URL}/usloob/login`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );


                const result = await response.json();


                /*
                 * Your Flask backend returns:
                 *
                 * {
                 *     "status": true,
                 *     "data": "Login Authorized."
                 * }
                 */


                if (result.status === true) {

                    // Login successful

                    sessionStorage.setItem(
                        "usloob_authenticated",
                        "true"
                    );

                    sessionStorage.setItem(
                        "usloob_username",
                        username
                    );


                    // Show success screen

                    successScreen.classList.add("show");


                    // Go to dashboard

                    setTimeout(function () {

                        window.location.href = "dashboard.html";

                    }, 1200);


                    return;
                }


                // Login failed

                showError(
                    result.data || "Invalid Login Credentials"
                );

                passwordInput.value = "";
                passwordInput.focus();

                setLoading(false);


            } catch (error) {

                console.error(
                    "USLOOB Login Error:",
                    error
                );


                showError(
                    "Unable to connect to the USLOOB server."
                );

                setLoading(false);

            }


        });


    </script>


</body>

</html>
